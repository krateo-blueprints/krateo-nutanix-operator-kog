name: lint

# Lints and renders every chart on pull requests, and validates that each chart's values.yaml
# satisfies its values.schema.json. Shape-agnostic: charts are discovered by locating each
# Chart.yaml (skipping vendored subcharts under charts/), so it works for any repo layout.
on:
  pull_request:
    paths:
      - "**"
  workflow_dispatch:

jobs:
  lint-docs:
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@e1d3e99215e80ae56eca4a67e9e061b2c73168b8 # 1.0.0

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Stamp the CHART_VERSION placeholder for CI
        run: |
          find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path './.git/*' \
            -exec sed -i "s/CHART_VERSION/0.0.0-ci/g" {} +

      - name: helm template + lint every chart (informational)
        run: |
          set -uo pipefail
          # Informational only: charts across repos legitimately require values or private
          # dependencies to render, so render/lint issues are surfaced as warnings, never failing
          # the build. The lint-docs job above is the authoritative gate.
          while IFS= read -r -d '' cf; do
            dir=$(dirname "$cf")
            echo "::group::${dir}"
            helm dependency update "$dir" 2>/dev/null || true
            helm template release "$dir" >/dev/null \
              || echo "::warning::helm template failed for ${dir} (may require values or private deps)"
            helm lint "$dir" || true
            echo "::endgroup::"
          done < <(find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path './.git/*' -print0)

  # The vendored Nutanix specs are pinned by sha256 in oas/SOURCES.yaml. .trivyignore.yaml exempts one
  # Trivy secret rule for oas/_official/prism-v4.0.yaml, and an ignore cannot match on a value, so this
  # gate is what keeps that exemption limited to Nutanix's published bytes. Python only, so it runs
  # beside the slow helm job, not after it.
  oas-sources:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: PyYAML for the manifest
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet "pyyaml==6.0.2"

      - name: The source-pin check refuses each kind of drift (self-test)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: /tmp/venv/bin/python hack/test-validate-oas-sources.py

      - name: Every vendored spec matches its pinned sha256 (oas/SOURCES.yaml)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: /tmp/venv/bin/python hack/validate-oas-sources.py .
